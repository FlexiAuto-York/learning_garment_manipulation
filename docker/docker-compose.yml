services:
  robot:
    build:
      context: .
      dockerfile: Dockerfile
    image: garment_folding:latest
    stdin_open: true
    tty: true
    privileged: true          # needed for USB (RealSense) and raw robot sockets
    network_mode: host        # the xArm control boxes sit on a private subnet

    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - PYTHONUNBUFFERED=1
      - GARMENT_DATA_ROOT=/workspace/data
      # Uncomment for a headless machine (no X server):
      # - QT_QPA_PLATFORM=offscreen
      # - SDL_VIDEODRIVER=dummy

    volumes:
      - ..:/workspace/learning_garment_manipulation      # this repository
      - ../../softgym:/workspace/softgym                 # PyFlex, built on the host
      - /tmp/.X11-unix:/tmp/.X11-unix:rw                 # GUI rendering
      - /dev/bus/usb:/dev/bus/usb                        # RealSense cameras
      - ${GARMENT_DATA_ROOT:-../data}:/workspace/data    # checkpoints and results

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    working_dir: /workspace/learning_garment_manipulation
    command: /bin/bash
